<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --neon:#ff2d55; --bg1:#1a0510; --bg2:#050107; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; font-family:'Poppins',system-ui,sans-serif; color:#fff; }
  body {
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2) 70%);
    display:flex; align-items:center; justify-content:center;
  }

  /* string lights */
  .lights { position:fixed; top:0; left:0; width:100%; height:40px; display:flex; justify-content:space-around; z-index:5; pointer-events:none; }
  .lights span {
    width:8px; height:8px; border-radius:50%; margin-top:14px; background:#ffd98a;
    box-shadow:0 0 10px 3px rgba(255,200,100,.8); animation:twinkle 2s infinite alternate;
  }
  .lights span:nth-child(odd){ animation-delay:.6s; }
  @keyframes twinkle { from{opacity:.35} to{opacity:1} }

  /* stage */
  .stage { text-align:center; padding:20px; max-width:520px; width:100%; z-index:10; }
  .stage.gallery-stage { max-width:980px; padding:16px 24px; }
  .step { display:none; animation:fadeUp .8s ease both; }
  .step.active { display:block; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:none} }

  .small-title { font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; margin-bottom:14px; opacity:.9; }

  .glass {
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(10px); border-radius:18px; padding:22px 20px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }

  .neon-btn {
    margin-top:16px; padding:10px 26px; border-radius:30px; font-family:'Poppins',sans-serif; font-size:.75rem; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:#fff; cursor:pointer;
    background:transparent; border:2px solid var(--neon);
    box-shadow:0 0 12px var(--neon), inset 0 0 12px rgba(255,45,85,.5);
    transition:transform .2s, background .2s;
  }
  .neon-btn:hover { transform:scale(1.06); background:rgba(255,45,85,.25); }

  /* message card */
  .msg h2 { font-family:'Great Vibes',cursive; font-weight:400; color:#ff6b8b; font-size:2.4rem; margin-bottom:8px; text-shadow:0 0 14px rgba(255,45,85,.6); }
  .msg p  {
    font-family:'Dancing Script',cursive; font-weight:500; font-size:1.25rem; line-height:1.55;
    text-align:left; min-height:200px; max-height:52vh; overflow-y:auto; opacity:.95;
  }

  /* gallery */
  .gallery-title {
    font-family:'Great Vibes',cursive; font-size:3rem; color:#ff8199;
    text-shadow:0 0 18px rgba(255,45,85,.55); margin-bottom:18px;
  }

  .folders { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .folder-card {
    position:relative; height:clamp(175px,30vh,235px); border-radius:12px; overflow:hidden; cursor:pointer;
    border:1px solid rgba(255,255,255,.55); box-shadow:0 10px 28px rgba(0,0,0,.45);
    background:#2a0f1a center/cover no-repeat; transition:transform .3s,border-color .3s,box-shadow .3s;
    opacity:0; animation:pop .7s ease forwards;
  }
  .folder-card:hover { transform:translateY(-5px); border-color:#ffb6c4; box-shadow:0 16px 34px rgba(0,0,0,.55),0 0 22px rgba(255,45,85,.2); }
  .folder-card::before { content:''; position:absolute; inset:0; background:linear-gradient(0deg,rgba(10,3,7,.88),rgba(10,3,7,.05) 75%); }
  .folder-card .label { position:absolute; left:22px; right:22px; bottom:18px; z-index:1; text-align:left; }
  .folder-card .label b { display:block; font-family:'Great Vibes',cursive; font-weight:400; font-size:2.5rem; text-shadow:0 2px 14px rgba(0,0,0,.8); }
  .folder-card .label small { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:#ffd5dc; }

  .photo-scroll { max-height:64vh; overflow-y:auto; padding:4px 8px 18px; scrollbar-color:rgba(255,129,153,.65) rgba(255,255,255,.08); }
  .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .photo {
    width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:8px; background:#2a0f1a;
    border:1px solid rgba(255,255,255,.65); box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer;
    opacity:0; transform:translateY(30px) scale(.85);
    transition:transform .25s,box-shadow .25s;
  }
  .photo.is-loaded {
    opacity:1; transform:none; animation:photoPop .65s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .photo:hover { transform:scale(1.035) rotate(-.5deg); box-shadow:0 12px 24px rgba(0,0,0,.65),0 0 14px rgba(255,45,85,.25); }
  @keyframes pop { to{opacity:1; transform:none} }
  @keyframes photoPop {
    0% { opacity:0; transform:translateY(30px) scale(.85); }
    70% { opacity:1; transform:translateY(-5px) scale(1.04); }
    100% { opacity:1; transform:none; }
  }

  /* full-screen photo view */
  .lightbox { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; padding:16px; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 0 30px rgba(255,45,85,.5); }

  /* balloons */
  .balloon {
    position:fixed; bottom:-120px; width:34px; height:44px; border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;
    z-index:3; animation:rise linear forwards; opacity:.9;
  }
  .balloon::after { content:''; position:absolute; left:50%; top:100%; width:1px; height:40px; background:rgba(255,255,255,.5); }
  @keyframes rise { to { transform:translateY(-130vh) translateX(var(--drift)); } }

  @media (max-width:760px) {
    .stage.gallery-stage { padding:14px 16px; }
    .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .folders { gap:12px; }
    .folder-card .label { left:16px; right:16px; }
    .folder-card .label b { font-size:2rem; }
  }
  @media (max-width:520px) {
    .stage.gallery-stage { padding:12px; }
    .gallery-title { font-size:2.5rem; margin-bottom:14px; }
    .folders { gap:10px; }
    .folder-card { height:155px; }
    .folder-card .label { left:12px; right:12px; bottom:12px; }
    .folder-card .label b { font-size:1.65rem; }
    .folder-card .label small { font-size:.58rem; }
    .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .photo-scroll { max-height:62vh; padding-inline:2px; }
  }
</style>
</head>
<body>

<div class="lights" id="lights"></div>

<div class="stage">

  <div class="step active" id="s0">
    <div class="glass">
      <div class="small-title" id="introText"></div>
      <button class="neon-btn" data-next>Open 🎁</button>
    </div>
  </div>

  <div class="step" id="s1">
    <div class="small-title">The stage is set...</div>
    <button class="neon-btn" data-next>Let's begin</button>
  </div>

  <div class="step" id="s2">
    <div class="small-title">Music makes it better...</div>
    <button class="neon-btn" id="musicBtn" data-next>▶ Play music</button>
  </div>

  <div class="step" id="s3">
    <div class="small-title">Let the colors fly!</div>
    <button class="neon-btn" id="balloonBtn" data-next>🎈 Fly balloons</button>
  </div>

  <div class="step" id="s4">
    <div class="small-title">Almost there...</div>
    <button class="neon-btn" data-next>Show the message</button>
  </div>

  <div class="step" id="s5">
    <div class="glass msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button class="neon-btn" data-next>Our memories</button>
    </div>
  </div>

  <div class="step" id="s6">
    <div class="gallery-title">Moments in Time</div>

    <div class="folders" id="folderView"></div>

    <div id="photoView" style="display:none;">
      <div class="photo-scroll"><div class="grid" id="grid"></div></div>
      <button class="neon-btn" id="backBtn">← Back</button>
    </div>
  </div>

</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<script>
/* =====================================================
   ✏️  EDIT ONLY THIS PART
   ===================================================== */
const CONFIG = {
  name: "susii",                        // 👈 birthday girl's name
  introLine: "Have a look at it",       // shows as: "Have a look at it susii Ji"
  suffix: "Ji",                         // set to "" if you don't want "Ji"

  // Photo files are stored directly in the image folder.
  folders: [
    { title: "The divaaa", path: "image", pattern: "photo{n}.jpg (2).jpeg", count: 13 },
    { title: "togetherr",  path: "image", pattern: "photo{n}.jpg.jpeg",      count: 19 }
  ],

  heading: "Happy Birthday 🎂",

  message:
    "dear Susii , wishing you a happiest birthday ever and also this is last year of minor lol, " +
    "I'm missing u too much coz we stayed for long time that we didn't expect, " +
    "we tried many thing together actually more than i did with my friends, " +
    "like two days back i rewatched video and photos we took oh maa gawd it was soo funny " +
    "i was laughing and also my eyes was filled with tears , " +
    "now we are in long distance friendship I'm wishing we both to continue our bond until last breath " +
    "may be it will cringe still its fine"
};
/* ===================================================== */

document.title = `Happy Birthday ${CONFIG.name} 🎂`;
document.getElementById('introText').textContent =
  `${CONFIG.introLine} ${CONFIG.name} ${CONFIG.suffix}`.trim();
document.getElementById('msgTitle').textContent = CONFIG.heading;

const lights = document.getElementById('lights');
for (let i = 0; i < 24; i++) lights.appendChild(document.createElement('span'));

let current = 0;
let birthdayAudio;
function playBirthdaySong() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  if (birthdayAudio) birthdayAudio.close();
  birthdayAudio = new AudioContextClass();
  birthdayAudio.resume().catch(() => {});

  const melody = [
    [392, 1], [392, 1], [440, 2], [392, 2], [523, 2], [494, 4],
    [392, 1], [392, 1], [440, 2], [392, 2], [587, 2], [523, 4],
    [392, 1], [392, 1], [784, 2], [659, 2], [523, 2], [494, 2], [440, 4],
    [698, 1], [698, 1], [659, 2], [523, 2], [587, 2], [523, 4]
  ];
  const beat = 0.34;
  let startAt = birthdayAudio.currentTime + 0.05;

  melody.forEach(([frequency, beats]) => {
    const duration = beats * beat;
    const oscillator = birthdayAudio.createOscillator();
    const volume = birthdayAudio.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.value = frequency;
    volume.gain.setValueAtTime(0.0001, startAt);
    volume.gain.exponentialRampToValueAtTime(0.16, startAt + 0.025);
    volume.gain.exponentialRampToValueAtTime(0.0001, startAt + duration - 0.025);
    oscillator.connect(volume);
    volume.connect(birthdayAudio.destination);
    oscillator.start(startAt);
    oscillator.stop(startAt + duration);
    startAt += duration + 0.035;
  });
}

function goTo(n) {
  document.getElementById('s' + current).classList.remove('active');
  current = n;
  document.getElementById('s' + current).classList.add('active');
  document.querySelector('.stage').classList.toggle('gallery-stage', n === 6);
  if (n === 5) typeMessage();
  if (n === 6) buildFolders();
}
document.querySelectorAll('[data-next]').forEach(btn =>
  btn.addEventListener('click', () => {
    if (btn.id === 'musicBtn')   playBirthdaySong();
    if (btn.id === 'balloonBtn') flyBalloons();
    goTo(current + 1);
  })
);

function flyBalloons() {
  const colors = ['#ff4d6d','#ffd166','#4cc9f0','#b388ff','#80ed99','#ff8fab'];
  for (let i = 0; i < 25; i++) {
    setTimeout(() => {
      const b = document.createElement('div');
      b.className = 'balloon';
      b.style.left = Math.random() * 95 + 'vw';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      b.style.animationDuration = (6 + Math.random() * 6) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 13000);
    }, i * 220);
  }
}

let typing;
function typeMessage() {
  const el = document.getElementById('msgText');
  el.textContent = '';
  let i = 0;
  clearInterval(typing);
  typing = setInterval(() => {
    el.textContent += CONFIG.message[i++];
    el.scrollTop = el.scrollHeight;
    if (i >= CONFIG.message.length) clearInterval(typing);
  }, 30);
}

/* ---------- gallery: folders -> photos ---------- */
const folderView = document.getElementById('folderView');
const photoView  = document.getElementById('photoView');
const grid       = document.getElementById('grid');

function photoSrc(folder, n) { return `${folder.path}/${folder.pattern.replace('{n}', n)}`; }

function buildFolders() {
  folderView.innerHTML = '';
  photoView.style.display = 'none';
  folderView.style.display = 'grid';
  CONFIG.folders.forEach((f, i) => {
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.style.backgroundImage = `url('${photoSrc(f, 1)}')`;
    card.style.animationDelay = (i * 0.3) + 's';
    card.innerHTML = `<div class="label"><b>${f.title}</b><small>${f.count} photos</small></div>`;
    card.addEventListener('click', () => openFolder(f));
    folderView.appendChild(card);
  });
}

function openFolder(f) {
  folderView.style.display = 'none';
  photoView.style.display = 'block';
  grid.innerHTML = '';
  for (let n = 1; n <= f.count; n++) {
    const img = document.createElement('img');
    img.className = 'photo';
    img.loading = 'lazy';
    img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true });
    img.addEventListener('error', () => img.classList.add('is-loaded'), { once: true });
    img.src = photoSrc(f, n);
    img.style.animationDelay = ((n - 1) * 0.07) + 's';
    img.addEventListener('click', () => showLightbox(img.src));
    grid.appendChild(img);
  }
  document.querySelector('.photo-scroll').scrollTop = 0;
}

document.getElementById('backBtn').addEventListener('click', buildFolders);

/* ---------- full-screen photo ---------- */
const lightbox = document.getElementById('lightbox');
function showLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  lightbox.classList.add('show');
}
lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
</script>
</body>
</html>
